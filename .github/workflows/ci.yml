name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERMINAL_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain-action@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --  --check
  clippy:
    name: clippy
    runs-on: ubunty-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain-action@v1
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
